name: Build starlink-Exporter
run-name: ${{ gitea.actor }} build starlink-exporter
on: [push]

env:
  DOCKER_REGISTRY: gitea.libretechconsulting.com
  DOCKER_USER: rmcguire
  DOCKER_REPO: 50w/starlink-exporter
  DOCKER_IMG: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO }}

jobs:
  Build-Starlink-Exporter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.API_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMG }}:${{ github.ref_name }}
            ${{ env.DOCKER_IMG }}:latest
